<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AION2 10인 5판 파티 배정</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">AION2 <span>|</span> 파티 배정</div>
  <button id="saveBtn">저장</button>
  <label class="button file">불러오기<input id="loadFile" type="file" accept=".json,application/json"></label>
  <div class="hint">플레이어 정보에서 등록한 닉네임과 직업을 편성표에 자동 표시</div>
</header>
<nav id="nav"></nav>
<main id="app"></main>

<dialog id="copyDialog">
  <h2>편성 닉네임 복사</h2>
  <textarea id="copyText" readonly></textarea>
  <div class="dialog-actions"><button id="copyConfirm">확인</button><button id="copyCancel">취소</button></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
